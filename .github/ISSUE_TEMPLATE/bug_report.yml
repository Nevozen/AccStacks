name: Bug report
description: Report reproducible incorrect behavior
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open Stocks\n2. Add an account\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AccStacks version or commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and private business data before submitting.
      render: text
