name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format lint types unit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-build-only-encryption-key

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: accstacks_test
          POSTGRES_USER: accstacks
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accstacks -d accstacks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://accstacks:ci-only-database-password@localhost:5432/accstacks_test?schema=public
          AUTH_SECRET: ci-integration-only-auth-secret

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: accstacks_test
          POSTGRES_USER: accstacks
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accstacks -d accstacks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgresql://accstacks:ci-only-database-password@localhost:5432/accstacks_test?schema=public
          AUTH_SECRET: ci-e2e-only-auth-secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
