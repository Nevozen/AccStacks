services:
  db:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accstacks}
      POSTGRES_USER: ${POSTGRES_USER:-accstacks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - accstacks-production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - accstacks-private

  migrator:
    build:
      context: .
      target: migrator
    profiles: ["migrate"]
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?Set PRODUCTION_DATABASE_URL using the db hostname}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - accstacks-private

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?Set PRODUCTION_DATABASE_URL using the db hostname}
      AUTH_SECRET: ${AUTH_SECRET:?Set a strong AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?Set the public HTTPS AUTH_URL}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?Set a stable encryption key}
    volumes:
      - accstacks-uploads:/data/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - accstacks-private

volumes:
  accstacks-production-postgres:
  accstacks-uploads:

networks:
  accstacks-private:
    driver: bridge
